<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RC Car Race Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
          .font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 1rem;
        }
        p {
            color: #7f8c8d;
            margin-bottom: 2.5rem;
        }
        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: block;
            background: #4a6fa5;
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 10px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:hover {
            background: #166088;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ready to Race?</h1>
    
        
        <div class="links-grid">
            <a href="chatgpt.html" class="btn">Chatgpt</a>
            <a href="deepseek.html" class="btn">Deepseek</a>
            <a href="gemini.html" class="btn">Gemini</a>
            <a href="grok.html" class="btn">Grok</a>
            <a href="perplexity.html" class="btn">Perplexity</a>
        </div>
    </div>

</body>
</html>
