<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RC Race Control</title>

<style>
:root{
    --bg:#0b0f17;
    --panel:#121826;
    --panel2:#1a2335;
    --accent:#46c2ff;
    --green:#4ade80;
    --yellow:#facc15;
    --red:#fb7185;
    --text:#e5eefc;
    --muted:#91a0bd;
    --border:#26324a;
    --shadow:0 12px 30px rgba(0,0,0,.35);
    --gold:#ffd700;
    --silver:#c0c0c0;
    --bronze:#cd7f32;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Inter,Segoe UI,Arial,sans-serif;
    background:linear-gradient(180deg,#09111d,#111827);
    color:var(--text);
    min-height:100vh;
}

button,input,select{
    font:inherit;
}

.hidden{
    display:none !important;
}

.screen{
    padding:24px;
    max-width:1600px;
    margin:auto;
}

h1,h2,h3{
    margin-top:0;
}

.main-menu{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:24px;
}

.title{
    font-size:clamp(2.8rem,5vw,5rem);
    font-weight:900;
    text-align:center;
    letter-spacing:2px;
}

.subtitle{
    color:var(--muted);
    text-align:center;
    margin-top:-8px;
}

.menu-buttons{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
}

.card-button{
    background:linear-gradient(145deg,var(--panel),var(--panel2));
    border:1px solid var(--border);
    color:var(--text);
    padding:32px;
    border-radius:24px;
    width:320px;
    cursor:pointer;
    transition:.2s ease;
    box-shadow:var(--shadow);
}

.card-button:hover{
    transform:translateY(-4px);
    border-color:var(--accent);
}

.card-button h2{
    font-size:2rem;
    margin-bottom:8px;
}

.card-button p{
    color:var(--muted);
    line-height:1.5;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:24px;
    gap:12px;
    flex-wrap:wrap;
}

.back-btn{
    background:#202b40;
}

button{
    background:var(--accent);
    border:none;
    color:white;
    padding:12px 18px;
    border-radius:12px;
    cursor:pointer;
    font-weight:700;
    transition:.15s ease;
}

button:hover{
    transform:translateY(-1px);
    filter:brightness(1.05);
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.danger{
    background:var(--red);
}

.success{
    background:var(--green);
}

.warning{
    background:var(--yellow);
    color:#1a1a1a;
}

.panel{
    background:rgba(18,24,38,.9);
    border:1px solid var(--border);
    border-radius:24px;
    padding:24px;
    box-shadow:var(--shadow);
}

.grid{
    display:grid;
    gap:24px;
}

.race-layout{
    grid-template-columns:420px 1fr;
}

.score-layout{
    grid-template-columns:420px 1fr;
}

@media(max-width:1000px){
    .race-layout,
    .score-layout{
        grid-template-columns:1fr;
    }
}

.input-group{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:16px;
}

input,select{
    background:#0d1523;
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    color:var(--text);
}

.timer-display{
    font-size:clamp(3rem,8vw,7rem);
    text-align:center;
    font-weight:900;
    margin:24px 0;
    letter-spacing:3px;
}

.button-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.button-row button{
    flex:1;
    min-width:120px;
}

.penalty-display{
    margin-top:20px;
    text-align:center;
    font-size:1.3rem;
    color:var(--yellow);
    font-weight:700;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:14px;
    text-align:left;
    border-bottom:1px solid rgba(255,255,255,.08);
}

th{
    color:var(--muted);
    font-size:.95rem;
}

.rank-1{
    background:rgba(255,215,0,.12);
}

.rank-2{
    background:rgba(192,192,192,.12);
}

.rank-3{
    background:rgba(205,127,50,.12);
}

.rank-badge{
    font-weight:900;
    font-size:1.2rem;
}

.player-card{
    background:#111a2a;
    border:1px solid var(--border);
    border-radius:18px;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.player-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
}

.score{
    font-size:3rem;
    font-weight:900;
}

.player-controls{
    display:flex;
    gap:8px;
}

.player-controls button{
    flex:1;
    font-size:1.2rem;
}

.players-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:18px;
}

.history{
    max-height:400px;
    overflow:auto;
    margin-top:12px;
}

.history-item{
    padding:12px;
    border-bottom:1px solid rgba(255,255,255,.08);
    color:#d6deef;
}

.small{
    font-size:.9rem;
    color:var(--muted);
}

.podium{
    display:flex;
    gap:12px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.podium-box{
    flex:1;
    min-width:180px;
    padding:18px;
    border-radius:18px;
    text-align:center;
    font-weight:800;
}

.gold{
    background:rgba(255,215,0,.15);
    border:1px solid rgba(255,215,0,.4);
}

.silver{
    background:rgba(192,192,192,.12);
    border:1px solid rgba(192,192,192,.3);
}

.bronze{
    background:rgba(205,127,50,.12);
    border:1px solid rgba(205,127,50,.3);
}

.footer-note{
    margin-top:28px;
    text-align:center;
    color:var(--muted);
    font-size:.9rem;
}
</style>
</head>

<body>

<!-- MAIN MENU -->
<section id="menuScreen" class="screen main-menu">
    <div class="title">🏁 RC RACE CONTROL</div>
    <div class="subtitle">
        Timing. Points. Chaos organized into spreadsheets with prettier colors.
    </div>

    <div class="menu-buttons">
        <button class="card-button" id="openRaceBtn">
            <h2>⏱ Race Timer</h2>
            <p>
                Single-driver timed runs with penalties, leaderboard sorting,
                podium positions, and persistent session tracking.
            </p>
        </button>

        <button class="card-button" id="openScoreBtn">
            <h2>🏆 Scoreboard</h2>
            <p>
                Dynamic points leaderboard with live ranking, event logs,
                custom bonuses, and final standings.
            </p>
        </button>
    </div>
</section>

<!-- RACE TIMER -->
<section id="raceScreen" class="screen hidden">
    <div class="topbar">
        <h1>⏱ Race Timer</h1>
        <button class="back-btn" id="backFromRace">⬅ Back</button>
    </div>

    <div class="grid race-layout">
        <div class="panel">
            <div class="input-group">
                <label>Driver Name</label>
                <input type="text" id="driverName" placeholder="Enter driver name"/>
            </div>

            <div class="input-group">
                <label>Session Mode</label>
                <select id="sessionMode">
                    <option value="multi">Multiple Runs / Best Time</option>
                    <option value="single">Single Event Mode</option>
                </select>
            </div>

            <div class="timer-display" id="timerDisplay">00:00.0</div>

            <div class="button-row">
                <button class="success" id="startBtn">Start</button>
                <button class="warning" id="pauseBtn" disabled>Pause</button>
                <button class="danger" id="stopBtn" disabled>Stop</button>
            </div>

            <div class="button-row" style="margin-top:12px;">
                <button id="penalty3Btn">+3s Penalty</button>
                <button id="penalty5Btn">+5s Penalty</button>
            </div>

            <div class="penalty-display">
                Current Penalties: <span id="penaltyTotal">0</span>s
            </div>

            <div style="margin-top:24px;">
                <button class="danger" id="resetRaceBtn">
                    Reset Race Session
                </button>
            </div>
        </div>

        <div class="panel">
            <h2>Leaderboard</h2>

            <div class="podium" id="racePodium"></div>

            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Driver</th>
                        <th>Raw Time</th>
                        <th>Penalty</th>
                        <th>Final Time</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody"></tbody>
            </table>
        </div>
    </div>
</section>

<!-- SCOREBOARD -->
<section id="scoreScreen" class="screen hidden">
    <div class="topbar">
        <h1>🏆 Points Scoreboard</h1>
        <button class="back-btn" id="backFromScore">⬅ Back</button>
    </div>

    <div class="grid score-layout">
        <div class="panel">
            <div class="input-group">
                <label>Point Increment</label>
                <input type="number" id="pointIncrement" value="1" min="1"/>
            </div>

            <div class="button-row">
                <button class="success" id="addPlayerBtn">
                    Add Player
                </button>

                <button class="danger" id="resetScoresBtn">
                    Reset Scores
                </button>
            </div>

            <hr style="margin:24px 0;border-color:rgba(255,255,255,.1);">

            <h3>Custom Point Event</h3>

            <div class="input-group">
                <label>Player</label>
                <select id="customPlayer"></select>
            </div>

            <div class="input-group">
                <label>Points</label>
                <input type="number" id="customPoints" value="5"/>
            </div>

            <div class="input-group">
                <label>Reason</label>
                <input type="text" id="customReason" placeholder="Fastest lap bonus"/>
            </div>

            <button id="applyCustomBtn">
                Apply Event
            </button>

            <hr style="margin:24px 0;border-color:rgba(255,255,255,.1);">

            <button id="toggleHistoryBtn">
                Show / Hide History
            </button>

            <div class="history hidden" id="historyPanel"></div>
        </div>

        <div class="panel">
            <h2>Standings</h2>

            <div class="podium" id="scorePodium"></div>

            <div class="players-grid" id="playersGrid"></div>
        </div>
    </div>
</section>

<script>
(() => {
    "use strict";

    const STORAGE_KEYS = {
        race: "rc_race_timer_data_v1",
        score: "rc_scoreboard_data_v1"
    };

    const appState = {
        race: {
            runs: [],
            mode: "multi",
            timerRunning: false,
            paused: false,
            startTimestamp: null,
            elapsedMs: 0,
            penalties: 0,
            intervalId: null
        },

        score: {
            players: [],
            history: []
        }
    };

    const $ = (id) => document.getElementById(id);

    function safeSave() {
        try{
            localStorage.setItem(STORAGE_KEYS.race, JSON.stringify(appState.race));
            localStorage.setItem(STORAGE_KEYS.score, JSON.stringify(appState.score));
        } catch(err){
            alert("LocalStorage save failed. Browser storage may be full.");
        }
    }

    function safeLoad() {
        try{
            const raceData = localStorage.getItem(STORAGE_KEYS.race);
            const scoreData = localStorage.getItem(STORAGE_KEYS.score);

            if(raceData){
                const parsed = JSON.parse(raceData);

                parsed.intervalId = null;
                parsed.timerRunning = false;
                parsed.paused = false;

                appState.race = {
                    ...appState.race,
                    ...parsed
                };
            }

            if(scoreData){
                appState.score = {
                    ...appState.score,
                    ...JSON.parse(scoreData)
                };
            }

        } catch(err){
            console.error("Load failed:", err);
        }
    }

    function showScreen(screenId){
        ["menuScreen","raceScreen","scoreScreen"]
        .forEach(id => $(id).classList.add("hidden"));

        $(screenId).classList.remove("hidden");
    }

    // --------------------------
    // RACE TIMER
    // --------------------------

    function formatTime(ms){
        const totalSeconds = ms / 1000;
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = Math.floor(totalSeconds % 60);
        const tenths = Math.floor((ms % 1000) / 100);

        return `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}.${tenths}`;
    }

    function updateTimerDisplay(){
        $("timerDisplay").textContent =
            formatTime(appState.race.elapsedMs);
    }

    function startTimer(){
        const name = $("driverName").value.trim();

        if(!name){
            alert("Enter a driver name first.");
            return;
        }

        if(appState.race.timerRunning){
            return;
        }

        appState.race.timerRunning = true;
        appState.race.paused = false;

        appState.race.startTimestamp =
            performance.now() - appState.race.elapsedMs;

        appState.race.intervalId = setInterval(() => {
            appState.race.elapsedMs =
                performance.now() - appState.race.startTimestamp;

            updateTimerDisplay();
        }, 50);

        $("startBtn").disabled = true;
        $("pauseBtn").disabled = false;
        $("stopBtn").disabled = false;

        safeSave();
    }

    function pauseResumeTimer(){
        if(!appState.race.timerRunning){
            return;
        }

        if(!appState.race.paused){
            clearInterval(appState.race.intervalId);

            appState.race.elapsedMs =
                performance.now() - appState.race.startTimestamp;

            appState.race.paused = true;

            $("pauseBtn").textContent = "Resume";
        } else {
            appState.race.startTimestamp =
                performance.now() - appState.race.elapsedMs;

            appState.race.intervalId = setInterval(() => {
                appState.race.elapsedMs =
                    performance.now() - appState.race.startTimestamp;

                updateTimerDisplay();
            }, 50);

            appState.race.paused = false;
            $("pauseBtn").textContent = "Pause";
        }

        safeSave();
    }

    function stopTimer(){
        if(!appState.race.timerRunning){
            return;
        }

        clearInterval(appState.race.intervalId);

        const rawMs = appState.race.elapsedMs;
        const penaltyMs = appState.race.penalties * 1000;
        const finalMs = rawMs + penaltyMs;

        const run = {
            id: crypto.randomUUID(),
            driver: $("driverName").value.trim(),
            rawMs,
            penaltySeconds: appState.race.penalties,
            finalMs,
            createdAt: Date.now()
        };

        if(appState.race.mode === "single"){
            appState.race.runs = [];
        }

        appState.race.runs.push(run);

        appState.race.timerRunning = false;
        appState.race.paused = false;
        appState.race.elapsedMs = 0;
        appState.race.penalties = 0;
        appState.race.intervalId = null;

        $("pauseBtn").textContent = "Pause";

        $("startBtn").disabled = false;
        $("pauseBtn").disabled = true;
        $("stopBtn").disabled = true;

        $("penaltyTotal").textContent = "0";

        updateTimerDisplay();
        renderLeaderboard();

        safeSave();
    }

    function addPenalty(seconds){
        appState.race.penalties += seconds;
        $("penaltyTotal").textContent =
            appState.race.penalties;

        safeSave();
    }

    function renderLeaderboard(){
        const tbody = $("leaderboardBody");
        tbody.innerHTML = "";

        const sorted = [...appState.race.runs]
        .sort((a,b) => a.finalMs - b.finalMs);

        sorted.forEach((run,index) => {
            const tr = document.createElement("tr");

            if(index === 0) tr.classList.add("rank-1");
            if(index === 1) tr.classList.add("rank-2");
            if(index === 2) tr.classList.add("rank-3");

            tr.innerHTML = `
                <td class="rank-badge">${index + 1}</td>
                <td>${escapeHtml(run.driver)}</td>
                <td>${formatTime(run.rawMs)}</td>
                <td>+${run.penaltySeconds}s</td>
                <td>${formatTime(run.finalMs)}</td>
            `;

            tbody.appendChild(tr);
        });

        renderRacePodium(sorted);
    }

    function renderRacePodium(sorted){
        const podium = $("racePodium");
        podium.innerHTML = "";

        const classes = ["gold","silver","bronze"];

        sorted.slice(0,3).forEach((run,index) => {
            const div = document.createElement("div");
            div.className = `podium-box ${classes[index]}`;

            div.innerHTML = `
                <div>${["🥇","🥈","🥉"][index]}</div>
                <div>${escapeHtml(run.driver)}</div>
                <div>${formatTime(run.finalMs)}</div>
            `;

            podium.appendChild(div);
        });
    }

    function resetRace(){
        if(!confirm("Clear all race runs and start a new session?")){
            return;
        }

        clearInterval(appState.race.intervalId);

        appState.race = {
            runs: [],
            mode: $("sessionMode").value,
            timerRunning:false,
            paused:false,
            startTimestamp:null,
            elapsedMs:0,
            penalties:0,
            intervalId:null
        };

        updateTimerDisplay();
        renderLeaderboard();

        $("penaltyTotal").textContent = "0";

        $("startBtn").disabled = false;
        $("pauseBtn").disabled = true;
        $("stopBtn").disabled = true;

        safeSave();
    }

    // --------------------------
    // SCOREBOARD
    // --------------------------

    function createPlayer(name="Player"){
        return {
            id: crypto.randomUUID(),
            name,
            points:0
        };
    }

    function renderPlayers(){
        const grid = $("playersGrid");
        const select = $("customPlayer");

        grid.innerHTML = "";
        select.innerHTML = "";

        const sorted = [...appState.score.players]
        .sort((a,b) => b.points - a.points);

        sorted.forEach((player,index) => {

            const option = document.createElement("option");
            option.value = player.id;
            option.textContent = player.name;
            select.appendChild(option);

            const card = document.createElement("div");

            if(index === 0) card.className = "player-card rank-1";
            else if(index === 1) card.className = "player-card rank-2";
            else if(index === 2) card.className = "player-card rank-3";
            else card.className = "player-card";

            card.innerHTML = `
                <div class="player-header">
                    <div>
                        <div class="small">Rank #${index + 1}</div>
                        <input 
                            value="${escapeAttribute(player.name)}"
                            data-player-id="${player.id}"
                            class="player-name-input"
                        />
                    </div>

                    <button class="danger remove-player-btn"
                        data-player-id="${player.id}">
                        ✕
                    </button>
                </div>

                <div class="score">${player.points}</div>

                <div class="player-controls">
                    <button class="warning minus-btn"
                        data-player-id="${player.id}">
                        −
                    </button>

                    <button class="success plus-btn"
                        data-player-id="${player.id}">
                        +
                    </button>
                </div>
            `;

            grid.appendChild(card);
        });

        bindPlayerEvents();
        renderScorePodium(sorted);
    }

    function renderScorePodium(sorted){
        const podium = $("scorePodium");
        podium.innerHTML = "";

        const classes = ["gold","silver","bronze"];

        sorted.slice(0,3).forEach((player,index) => {
            const div = document.createElement("div");

            div.className = `podium-box ${classes[index]}`;

            div.innerHTML = `
                <div>${["🥇","🥈","🥉"][index]}</div>
                <div>${escapeHtml(player.name)}</div>
                <div>${player.points} pts</div>
            `;

            podium.appendChild(div);
        });
    }

    function bindPlayerEvents(){

        document.querySelectorAll(".plus-btn")
        .forEach(btn => {
            btn.onclick = () => {
                adjustPlayerPoints(
                    btn.dataset.playerId,
                    getIncrement(),
                    "Manual increase"
                );
            };
        });

        document.querySelectorAll(".minus-btn")
        .forEach(btn => {
            btn.onclick = () => {
                adjustPlayerPoints(
                    btn.dataset.playerId,
                    -getIncrement(),
                    "Manual decrease"
                );
            };
        });

        document.querySelectorAll(".remove-player-btn")
        .forEach(btn => {
            btn.onclick = () => {
                if(appState.score.players.length <= 2){
                    alert("Minimum 2 players required.");
                    return;
                }

                appState.score.players =
                    appState.score.players.filter(
                        p => p.id !== btn.dataset.playerId
                    );

                renderPlayers();
                safeSave();
            };
        });

        document.querySelectorAll(".player-name-input")
        .forEach(input => {
            input.onchange = () => {
                const player = appState.score.players.find(
                    p => p.id === input.dataset.playerId
                );

                if(player){
                    player.name = input.value.trim() || "Unnamed";
                    renderPlayers();
                    safeSave();
                }
            };
        });
    }

    function getIncrement(){
        const val = parseInt($("pointIncrement").value,10);

        if(Number.isNaN(val) || val <= 0){
            return 1;
        }

        return val;
    }

    function adjustPlayerPoints(playerId, amount, reason){
        const player = appState.score.players.find(
            p => p.id === playerId
        );

        if(!player){
            return;
        }

        player.points += amount;

        appState.score.history.unshift({
            id: crypto.randomUUID(),
            player: player.name,
            amount,
            reason,
            timestamp: Date.now()
        });

        renderPlayers();
        renderHistory();
        safeSave();
    }

    function renderHistory(){
        const panel = $("historyPanel");

        panel.innerHTML = "";

        appState.score.history.forEach(item => {
            const div = document.createElement("div");
            div.className = "history-item";

            const time = new Date(item.timestamp)
            .toLocaleTimeString();

            div.innerHTML = `
                <strong>${escapeHtml(item.player)}</strong>
                ${item.amount >= 0 ? "+" : ""}
                ${item.amount} pts
                <div class="small">
                    ${escapeHtml(item.reason)} • ${time}
                </div>
            `;

            panel.appendChild(div);
        });
    }

    function resetScores(){
        if(!confirm("Reset all scores and history?")){
            return;
        }

        appState.score.players.forEach(p => p.points = 0);
        appState.score.history = [];

        renderPlayers();
        renderHistory();
        safeSave();
    }

    // --------------------------
    // HELPERS
    // --------------------------

    function escapeHtml(str){
        return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;");
    }

    function escapeAttribute(str){
        return escapeHtml(str);
    }

    // --------------------------
    // EVENTS
    // --------------------------

    $("openRaceBtn").onclick = () => showScreen("raceScreen");
    $("openScoreBtn").onclick = () => showScreen("scoreScreen");

    $("backFromRace").onclick = () => showScreen("menuScreen");
    $("backFromScore").onclick = () => showScreen("menuScreen");

    $("startBtn").onclick = startTimer;
    $("pauseBtn").onclick = pauseResumeTimer;
    $("stopBtn").onclick = stopTimer;

    $("penalty3Btn").onclick = () => addPenalty(3);
    $("penalty5Btn").onclick = () => addPenalty(5);

    $("resetRaceBtn").onclick = resetRace;

    $("sessionMode").onchange = (e) => {
        appState.race.mode = e.target.value;
        safeSave();
    };

    $("addPlayerBtn").onclick = () => {
        appState.score.players.push(
            createPlayer(
                `Player ${appState.score.players.length + 1}`
            )
        );

        renderPlayers();
        safeSave();
    };

    $("applyCustomBtn").onclick = () => {
        const playerId = $("customPlayer").value;
        const points = parseInt($("customPoints").value,10);
        const reason =
            $("customReason").value.trim() || "Custom event";

        if(Number.isNaN(points)){
            alert("Enter a valid point value.");
            return;
        }

        adjustPlayerPoints(playerId, points, reason);

        $("customReason").value = "";
    };

    $("toggleHistoryBtn").onclick = () => {
        $("historyPanel").classList.toggle("hidden");
    };

    $("resetScoresBtn").onclick = resetScores;

    // --------------------------
    // INIT
    // --------------------------

    function initialize(){

        safeLoad();

        if(appState.score.players.length < 2){
            appState.score.players = [
                createPlayer("Player 1"),
                createPlayer("Player 2")
            ];
        }

        $("sessionMode").value = appState.race.mode;

        updateTimerDisplay();
        renderLeaderboard();
        renderPlayers();
        renderHistory();

        window.addEventListener("beforeunload", () => {
            clearInterval(appState.race.intervalId);
            safeSave();
        });
    }

    initialize();

})();
</script>

</body>
</html>
