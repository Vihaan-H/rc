<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RC RACE HUB</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
        
        :root {
            --bg: #0a0a0a;
            --accent: #00ff9d;
            --red: #ff2d55;
            --yellow: #ffd700;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Press Start 2P', system-ui;
            background: var(--bg);
            color: #eee;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        header {
            background: #111;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--accent);
            box-shadow: 0 4px 0 #000;
        }
        
        h1 {
            font-size: 28px;
            color: var(--accent);
            text-shadow: 4px 4px 0 #000;
        }
        
        .mode-title {
            font-size: 24px;
            color: var(--accent);
        }
        
        main {
            flex: 1;
            padding: 20px;
            overflow: auto;
            display: flex;
            flex-direction: column;
        }
        
        .menu {
            display: flex;
            flex-direction: column;
            gap: 30px;
            justify-content: center;
            align-items: center;
            height: 100%;
        }
        
        .menu-btn {
            width: 420px;
            padding: 30px;
            font-size: 28px;
            background: #111;
            color: var(--accent);
            border: 6px solid var(--accent);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 8px 8px 0 #000;
        }
        
        .menu-btn:hover {
            transform: translate(-4px, -4px);
            box-shadow: 12px 12px 0 #000;
        }
        
        .hidden {
            display: none !important;
        }
        
        /* Timer Mode */
        .timer-display {
            font-size: 120px;
            font-weight: bold;
            text-align: center;
            background: #111;
            padding: 20px;
            border: 8px solid var(--accent);
            margin-bottom: 20px;
            letter-spacing: 8px;
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 40px rgba(0, 255, 157, 0.3);
        }
        
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        button {
            font-family: 'Press Start 2P', system-ui;
            padding: 16px 28px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.1s;
        }
        
        .btn-start {
            background: #00ff9d;
            color: #000;
            border: 6px solid #000;
            flex: 1;
            max-width: 280px;
        }
        
        .btn-stop {
            background: var(--red);
            color: white;
            border: 6px solid #000;
        }
        
        .btn-penalty {
            background: #ff9800;
            color: white;
            border: 6px solid #000;
        }
        
        .driver-input {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        input, select {
            font-family: 'Press Start 2P', system-ui;
            padding: 14px;
            font-size: 18px;
            background: #222;
            color: #fff;
            border: 4px solid #555;
        }
        
        .leaderboard {
            background: #111;
            border: 6px solid #444;
            padding: 15px;
            flex: 1;
            overflow: auto;
            max-height: 50vh;
        }
        
        .lb-entry {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            margin-bottom: 8px;
            background: #1a1a1a;
            border-left: 8px solid var(--accent);
        }
        
        .lb-entry.gold { border-left-color: #ffd700; }
        .lb-entry.silver { border-left-color: #c0c0c0; }
        .lb-entry.bronze { border-left-color: #cd7f32; }
        
        /* Scoreboard */
        .players {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .player-card {
            background: #111;
            border: 6px solid var(--accent);
            padding: 20px;
        }
        
        .player-name {
            font-size: 22px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .player-score {
            font-size: 72px;
            text-align: center;
            margin: 15px 0;
            color: var(--accent);
        }
        
        .point-controls {
            display: flex;
            gap: 10px;
        }
        
        .history {
            background: #111;
            max-height: 300px;
            overflow: auto;
            padding: 15px;
            font-size: 14px;
            line-height: 1.4;
        }
        
        .back-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            padding: 15px 30px;
            background: #333;
            color: white;
            border: 4px solid #666;
            font-size: 18px;
            z-index: 100;
        }
        
        .rank {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
            min-width: 40px;
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <h1>RC RACE HUB</h1>
        <div id="current-mode" class="mode-title">MAIN MENU</div>
    </header>

    <!-- MAIN MENU -->
    <div id="menu-screen" class="menu">
        <button onclick="switchMode('timer')" class="menu-btn">RACE TIMER</button>
        <button onclick="switchMode('scoreboard')" class="menu-btn">POINTS SCOREBOARD</button>
    </div>

    <!-- RACE TIMER SCREEN -->
    <div id="timer-screen" class="hidden">
        <div class="driver-input">
            <input type="text" id="driver-name" placeholder="DRIVER NAME" style="flex:1">
            <select id="session-mode">
                <option value="single">Single Run Mode</option>
                <option value="multi">Multi-Run (Best Time)</option>
            </select>
        </div>

        <div id="timer-display" class="timer-display">00:00.000</div>

        <div class="controls">
            <button id="start-btn" onclick="toggleTimer()" class="btn-start">START</button>
            <button onclick="stopRun()" class="btn-stop">STOP &amp; SAVE</button>
            <button onclick="addPenalty(3)" class="btn-penalty">+3s PENALTY</button>
            <button onclick="addPenalty(5)" class="btn-penalty">+5s PENALTY</button>
        </div>

        <div style="display:flex; gap:15px; margin-bottom:20px;">
            <button onclick="resetTimerSession()" style="background:#333;color:#ccc;border:4px solid #666;">NEW SESSION</button>
        </div>

        <h2 style="margin:15px 0; color:#aaa;">LEADERBOARD</h2>
        <div id="timer-leaderboard" class="leaderboard"></div>
    </div>

    <!-- SCOREBOARD SCREEN -->
    <div id="scoreboard-screen" class="hidden">
        <div style="margin-bottom:20px; display:flex; gap:15px; align-items:center;">
            <button onclick="addNewPlayer()" style="background:#00ff9d;color:#000;">+ ADD PLAYER</button>
            <button onclick="resetScoreboard()" style="background:#333;color:#ccc;">RESET ALL SCORES</button>
            <button onclick="toggleHistory()" style="background:#444;">HISTORY</button>
            
            <div style="margin-left:auto; display:flex; align-items:center; gap:10px;">
                <span>Increment:</span>
                <input id="point-inc" type="number" value="5" style="width:80px">
            </div>
        </div>

        <div id="players-container" class="players"></div>

        <h2 style="margin:20px 0 10px; color:#aaa;">POINT HISTORY <span id="history-toggle" onclick="toggleHistory()" style="cursor:pointer; font-size:14px; color:#666;">[hide]</span></h2>
        <div id="history-panel" class="history"></div>
    </div>

    <!-- BACK BUTTON -->
    <button onclick="backToMenu()" class="back-btn">← BACK TO MENU</button>

    <script>
        // ============== STATE ==============
        let currentMode = null;
        let timerInterval = null;
        let currentTime = 0;
        let isRunning = false;
        let penalties = 0;
        let timerRuns = [];
        let players = [];
        let history = [];
        
        const STORAGE_KEYS = {
            timerRuns: 'rc_race_timer_runs',
            players: 'rc_race_scoreboard_players',
            history: 'rc_race_scoreboard_history'
        };

        // ============== UTILITIES ==============
        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const centiseconds = Math.floor((ms % 1000) / 10);
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${centiseconds.toString().padStart(2, '0')}`;
        }

        function saveToStorage() {
            localStorage.setItem(STORAGE_KEYS.timerRuns, JSON.stringify(timerRuns));
            localStorage.setItem(STORAGE_KEYS.players, JSON.stringify(players));
            localStorage.setItem(STORAGE_KEYS.history, JSON.stringify(history));
        }

        function loadFromStorage() {
            const savedRuns = localStorage.getItem(STORAGE_KEYS.timerRuns);
            if (savedRuns) timerRuns = JSON.parse(savedRuns);
            
            const savedPlayers = localStorage.getItem(STORAGE_KEYS.players);
            if (savedPlayers) players = JSON.parse(savedPlayers);
            
            const savedHistory = localStorage.getItem(STORAGE_KEYS.history);
            if (savedHistory) history = JSON.parse(savedHistory);
        }

        // ============== MODE SWITCHING ==============
        function switchMode(mode) {
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('timer-screen').classList.add('hidden');
            document.getElementById('scoreboard-screen').classList.add('hidden');
            
            if (mode === 'timer') {
                document.getElementById('timer-screen').classList.remove('hidden');
                document.getElementById('current-mode').textContent = 'RACE TIMER';
                renderTimerLeaderboard();
            } else if (mode === 'scoreboard') {
                document.getElementById('scoreboard-screen').classList.remove('hidden');
                document.getElementById('current-mode').textContent = 'POINTS SCOREBOARD';
                renderScoreboard();
            }
            currentMode = mode;
        }

        function backToMenu() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            isRunning = false;
            document.getElementById('menu-screen').classList.remove('hidden');
            document.getElementById('timer-screen').classList.add('hidden');
            document.getElementById('scoreboard-screen').classList.add('hidden');
            document.getElementById('current-mode').textContent = 'MAIN MENU';
        }

        // ============== RACE TIMER ==============
        function toggleTimer() {
            const startBtn = document.getElementById('start-btn');
            
            if (!isRunning) {
                // Start or resume
                if (!timerInterval) {
                    timerInterval = setInterval(() => {
                        currentTime += 10;
                        document.getElementById('timer-display').textContent = formatTime(currentTime);
                    }, 10);
                }
                isRunning = true;
                startBtn.textContent = 'PAUSE';
                startBtn.style.background = '#ffeb3b';
            } else {
                // Pause
                clearInterval(timerInterval);
                timerInterval = null;
                isRunning = false;
                startBtn.textContent = 'RESUME';
                startBtn.style.background = '#00ff9d';
            }
        }

        function addPenalty(seconds) {
            penalties += seconds;
            // Visual feedback
            const display = document.getElementById('timer-display');
            display.style.color = '#ff9800';
            setTimeout(() => {
                if (display) display.style.color = '#eee';
            }, 300);
        }

        function stopRun() {
            if (!isRunning && currentTime === 0) return;
            
            const driverName = document.getElementById('driver-name').value.trim() || "Unknown Driver";
            
            const rawTime = currentTime;
            const finalTime = rawTime + (penalties * 1000);
            
            const run = {
                id: Date.now(),
                driver: driverName,
                rawTime: rawTime,
                penalties: penalties,
                finalTime: finalTime,
                timestamp: new Date().toISOString()
            };
            
            timerRuns.push(run);
            saveToStorage();
            renderTimerLeaderboard();
            
            // Reset for next run
            resetCurrentTimer();
        }

        function resetCurrentTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null;
            currentTime = 0;
            penalties = 0;
            isRunning = false;
            document.getElementById('timer-display').textContent = '00:00.000';
            document.getElementById('start-btn').textContent = 'START';
            document.getElementById('start-btn').style.background = '#00ff9d';
        }

        function renderTimerLeaderboard() {
            const container = document.getElementById('timer-leaderboard');
            container.innerHTML = '';
            
            if (timerRuns.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:40px; color:#555;">No runs yet. Start racing!</div>';
                return;
            }
            
            // Sort by final time
            const sorted = [...timerRuns].sort((a, b) => a.finalTime - b.finalTime);
            
            sorted.forEach((run, index) => {
                const entry = document.createElement('div');
                entry.className = 'lb-entry';
                
                if (index === 0) entry.classList.add('gold');
                else if (index === 1) entry.classList.add('silver');
                else if (index === 2) entry.classList.add('bronze');
                
                const timeStr = formatTime(run.finalTime);
                const penaltyStr = run.penalties > 0 ? ` <span style="color:#ff9800">+${run.penalties}s</span>` : '';
                
                entry.innerHTML = `
                    <div style="display:flex; align-items:center; gap:15px;">
                        <span class="rank">#${index+1}</span>
                        <span>${run.driver}</span>
                    </div>
                    <div style="text-align:right;">
                        <span style="font-size:22px;">${timeStr}</span>${penaltyStr}
                    </div>
                `;
                container.appendChild(entry);
            });
        }

        function resetTimerSession() {
            if (!confirm('Clear ALL timer data and start a new session?')) return;
            timerRuns = [];
            saveToStorage();
            renderTimerLeaderboard();
            resetCurrentTimer();
        }

        // ============== SCOREBOARD ==============
        function renderScoreboard() {
            const container = document.getElementById('players-container');
            container.innerHTML = '';
            
            if (players.length === 0) {
                players = [
                    {id: 1, name: "Red Racer", score: 25},
                    {id: 2, name: "Blue Bolt", score: 18}
                ];
                saveToStorage();
            }
            
            // Sort by score descending
            const sortedPlayers = [...players].sort((a, b) => b.score - a.score);
            
            sortedPlayers.forEach((player, idx) => {
                const card = document.createElement('div');
                card.className = 'player-card';
                card.innerHTML = `
                    <div class="player-name">
                        <span class="rank">#${idx+1}</span>
                        <input type="text" value="${player.name}" 
                               onblur="updatePlayerName(${player.id}, this.value)" 
                               style="background:transparent; border:none; color:white; font-size:22px; flex:1; outline:none;">
                    </div>
                    <div class="player-score">${player.score}</div>
                    <div class="point-controls">
                        <button onclick="adjustScore(${player.id}, -parseInt(document.getElementById('point-inc').value))" 
                                style="background:#ff2d55; flex:1;">−</button>
                        <button onclick="adjustScore(${player.id}, parseInt(document.getElementById('point-inc').value))" 
                                style="background:#00ff9d; flex:1;">+</button>
                    </div>
                    <div style="margin-top:12px; display:flex; gap:8px;">
                        <button onclick="customPoints(${player.id})" style="font-size:13px; padding:8px; flex:1;">CUSTOM</button>
                        <button onclick="removePlayer(${player.id})" style="font-size:13px; padding:8px; background:#444; flex:1;">REMOVE</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function addNewPlayer() {
            const name = prompt("New player name:", "New Driver " + (players.length + 1));
            if (!name) return;
            
            players.push({
                id: Date.now(),
                name: name.trim(),
                score: 0
            });
            saveToStorage();
            renderScoreboard();
        }

        function updatePlayerName(id, newName) {
            const player = players.find(p => p.id === id);
            if (player) {
                player.name = newName.trim() || "Unnamed";
                saveToStorage();
                renderScoreboard();
            }
        }

        function adjustScore(id, amount) {
            const player = players.find(p => p.id === id);
            if (!player) return;
            
            player.score += amount;
            if (player.score < 0) player.score = 0;
            
            addToHistory(player.name, amount, amount > 0 ? "Manual +" : "Manual -");
            saveToStorage();
            renderScoreboard();
        }

        function customPoints(id) {
            const player = players.find(p => p.id === id);
            if (!player) return;
            
            const pts = parseInt(prompt(`Points for ${player.name}:`, "10"));
            if (isNaN(pts)) return;
            
            player.score += pts;
            if (player.score < 0) player.score = 0;
            
            addToHistory(player.name, pts, "Custom Event");
            saveToStorage();
            renderScoreboard();
        }

        function removePlayer(id) {
            if (!confirm("Remove this player?")) return;
            players = players.filter(p => p.id !== id);
            saveToStorage();
            renderScoreboard();
        }

        function addToHistory(playerName, amount, reason) {
            history.unshift({
                id: Date.now(),
                player: playerName,
                amount: amount,
                reason: reason,
                time: new Date().toLocaleTimeString()
            });
            
            // Keep last 50 entries
            if (history.length > 50) history.pop();
            saveToStorage();
            renderHistory();
        }

        function renderHistory() {
            const panel = document.getElementById('history-panel');
            panel.innerHTML = '';
            
            if (history.length === 0) {
                panel.innerHTML = '<div style="text-align:center; color:#555; padding:20px;">No history yet</div>';
                return;
            }
            
            history.forEach(entry => {
                const sign = entry.amount > 0 ? '+' : '';
                const div = document.createElement('div');
                div.style.marginBottom = '8px';
                div.style.borderBottom = '1px solid #333';
                div.style.paddingBottom = '6px';
                div.innerHTML = `
                    <strong>${entry.time}</strong> — 
                    <span style="color:${entry.amount > 0 ? '#00ff9d' : '#ff2d55'}">
                        ${sign}${entry.amount}
                    </span> 
                    ${entry.player} <span style="color:#888">(${entry.reason})</span>
                `;
                panel.appendChild(div);
            });
        }

        function toggleHistory() {
            const panel = document.getElementById('history-panel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        function resetScoreboard() {
            if (!confirm("Reset ALL scores to zero?")) return;
            players.forEach(p => p.score = 0);
            history = [];
            saveToStorage();
            renderScoreboard();
            renderHistory();
        }

        // ============== INITIALIZATION ==============
        function init() {
            loadFromStorage();
            
            // Keyboard shortcuts
            document.addEventListener('keydown', function(e) {
                if (currentMode !== 'timer') return;
                
                if (e.key === " " || e.key === "Spacebar") {
                    e.preventDefault();
                    toggleTimer();
                }
                
                if (e.key === "Enter") {
                    stopRun();
                }
            });
            
            // Initial renders
            renderTimerLeaderboard();
            renderHistory();
            
            // Make sure history starts hidden
            document.getElementById('history-panel').style.display = 'none';
            
            console.log('%cRC Race Hub initialized successfully', 'color:#00ff9d; font-family:monospace');
        }
        
        // Boot the app
        window.onload = init;
    </script>
</body>
</html>
